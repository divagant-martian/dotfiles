# Font — Fira Code with ligatures (on by default in kitty)
font_family      Fira Code
font_size        12.0
bold_is_bright   yes

# Scrollback
scrollback_lines -1

# Bell
enable_audio_bell yes
visual_bell_duration 0.0

# UI
hide_window_decorations yes
confirm_os_window_close 0
copy_on_select clipboard

# Remote control (used by opacity-watcher.sh to set per-theme opacity)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

background_opacity 0.90
background_blur 8

# Tab bar at bottom
tab_bar_edge     bottom
tab_bar_style    separator
enabled_layouts  splits,stack

#── Keybindings ──────────────────────────────────────────────────────────────
# Unmap kitty defaults that conflict
map ctrl+shift+t no_op

# new_tab = <Primary>k
map ctrl+k         new_tab

# go_* = <Primary><Alt><Arrow>
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right

# split_horiz = <Primary><Shift>t  (horizontal divider → top/bottom panes)
map ctrl+shift+t   launch --location=hsplit

# split_vert = <Primary>t  (vertical divider → left/right panes)
map ctrl+t         launch --location=vsplit
